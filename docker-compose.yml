version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sportshop-backend
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - MONGODB_URI=${MONGODB_URI}
      - SESSION_SECRET=${SESSION_SECRET}
      - PORT=3000
    networks:
      - internal-net

  mcp:
    build:
      context: ../MCP-EMA
      dockerfile: Dockerfile
    container_name: mcp-server
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - BACKEND_URL=http://backend:3000
    depends_on:
      - backend
    networks:
      - internal-net

networks:
  internal-net:
    driver: bridge
