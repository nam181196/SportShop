version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: mongodb
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    networks:
      - internal-net
    # Không dùng "ports: - '27017:27017'" để tránh expose database ra ngoài Internet

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sportshop-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/sportShopDB
    depends_on:
      - mongodb
    networks:
      - internal-net

  mcp:
    build:
      context: ../MCP-EMA
      dockerfile: Dockerfile
    container_name: mcp-server
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - BACKEND_URL=http://backend:3000
    depends_on:
      - backend
    networks:
      - internal-net

networks:
  internal-net:
    driver: bridge

volumes:
  mongo-data:
